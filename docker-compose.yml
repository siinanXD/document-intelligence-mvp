services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: document_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    # Kept in step with the qdrant-client pin in pyproject.toml: Qdrant
    # requires a matching major and at most one minor of drift, and
    # tests/test_dependency_consistency.py fails if the two diverge.
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No healthcheck: the Qdrant image ships no shell or curl to probe with,
    # and a check that can never pass would block anything that later waits on
    # `service_healthy`. Readiness is asserted by the API's own /health/ready.

volumes:
  postgres_data:
  qdrant_data:
