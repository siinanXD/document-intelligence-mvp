name: CI

on:
  push:
    # Nur main: Pushes auf Feature-Branches laufen ohnehin ueber den
    # pull_request-Trigger; "**" hat jeden PR-Push doppelt gerechnet.
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: document_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/document_intelligence_test
      # Without this a missing database would silently skip every database
      # test and the run would still be green.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: No secrets in tracked files
        run: |
          # A committed .env is the most likely way a credential reaches the
          # repository. Fail loudly rather than relying on .gitignore holding.
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env is tracked by git - it must never be committed"
            exit 1
          fi
          if git ls-files -z | xargs -0 grep -lE \
              '(sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' ; then
            echo "::error::a credential-shaped literal is present in a tracked file"
            exit 1
          fi
          echo "no tracked secrets found"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest --ignore=tests/test_docling_parser.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        run: npm ci --prefix web
      - name: Lint
        run: npm run lint --prefix web
      - name: Typecheck
        run: npm run typecheck --prefix web
      - name: Tests
        run: npm test --prefix web

  # Docling pulls torch and friends - several gigabytes and minutes of install
  # time - so it does not belong in the loop every push waits on. This job
  # exercises the real parser separately, and does not gate the fast one.
  parsing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with the parsing extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parsing]"

      - name: Parser tests
        # The PDF test needs Docling's downloaded layout model. It is opt-in
        # via --run-docling-models; see the module docstring for why.
        run: pytest tests/test_docling_parser.py

  copilot-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Request Copilot code review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
