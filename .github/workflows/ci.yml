name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: document_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/document_intelligence_test
      # Without this a missing database would silently skip every database
      # test and the run would still be green.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: No secrets in tracked files
        run: |
          # A committed .env is the most likely way a credential reaches the
          # repository. Fail loudly rather than relying on .gitignore holding.
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env is tracked by git - it must never be committed"
            exit 1
          fi
          if git ls-files -z | xargs -0 grep -lE \
              '(sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' ; then
            echo "::error::a credential-shaped literal is present in a tracked file"
            exit 1
          fi
          echo "no tracked secrets found"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest
